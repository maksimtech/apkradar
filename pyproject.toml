[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apkradar"
dynamic = ["version"]
description = "APK compliance auditor — tracker detection, permissions analysis, GDPR art.9"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "security@maksimtech.com"}
]
keywords = ["gdpr", "apk", "android", "tracker", "privacy", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "androguard>=4.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "google-play-scraper>=1.2.7",
    "mailradar>=2026.9.4",
    "cookieradar>=2026.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.16",
    "mypy>=1.18",
    "hypothesis>=6.140",
    "mutmut>=3.8",
]

[project.scripts]
apkradar = "apkradar.cli:app"

[tool.hatch.version]
path = "apkradar/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/benchmarks"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Useful without being noisy. The security ruleset S is deliberately absent:
# ruff's S rules *are* flake8-bandit — measured on 2026-09-24, S110 and B110
# reported the same four try-except-pass — so selecting it here would report
# every finding twice, under two ids, in two places to be archived.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 objects to a function call in an argument default, and Typer's entire
# API is exactly that: `def cmd(x: str = typer.Option(...))`. There is no fix
# on this side — moving the call into the body would stop Typer seeing the
# option at all — so the two calls are declared immutable instead.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# A test may import for a side effect, or redefine a fixture name to make the
# case read; neither is a defect there.
"tests/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.11"
# Not strict mode: androguard, openpyxl and google-play-scraper ship no
# py.typed, so strict would spend its errors on the untyped edge rather than on
# this code — and an error that cannot be acted on teaches the reader to ignore
# the tool. The permissive run still found real defects.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Tests assert against deliberately malformed input; annotating that would
# describe the fixtures rather than check the code.
module = "tests.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["apkradar"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut 3.8 refuses to run on Windows and points at WSL, so this is a CI-only
# configuration: the scheduled workflow runs it on ubuntu.
do_not_mutate = ["apkradar/__init__.py"]
