[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apkradar"
dynamic = ["version"]
description = "APK compliance auditor — tracker detection, permissions analysis, GDPR art.9"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "security@maksimtech.com"}
]
keywords = ["gdpr", "apk", "android", "tracker", "privacy", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "androguard>=4.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "google-play-scraper>=1.2.7",
    "mailradar>=2026.9.4",
    "cookieradar>=2026.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
]

[project.scripts]
apkradar = "apkradar.cli:app"

[tool.hatch.version]
path = "apkradar/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/benchmarks"
