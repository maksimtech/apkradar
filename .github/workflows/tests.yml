name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # id-token: write lets the coverage upload prove to Codecov, through GitHub's
    # OIDC, which repository it comes from. Job permissions replace the workflow's,
    # so contents: read is repeated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The same list as the classifiers in pyproject.toml, which
        # tests/test_ci_dependencies.py checks.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          # The next Python, from its development branch, allowed to fail:
          # 3.16 goes final in October 2027 (PEP 602's yearly cadence), and a
          # dependency without a wheel for it should show up here first, not
          # after the classifier.
          - python-version: "3.16-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"  # NOSONAR
      - name: Run tests
        run: |
          pytest tests/ --ignore=tests/benchmarks --cov=apkradar --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        # One upload is enough, from a row that has to pass. 3.12 is in every Radar's
        # matrix.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # OIDC, not a CODECOV_TOKEN secret: Codecov files an upload under the
          # project its token belongs to, and three Radars had another's
          # (tests/test_codecov_upload.py). `files`, the input v7 reads.
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false
  summary:
    # The branch ruleset on main requires a check named exactly "Tests", which
    # the matrix job can no longer provide now that its name carries the Python
    # version. always(): a skipped required check counts as passed, so this job
    # has to run even when a needed job fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
