name: Docker Scout CVE Scan
on:
  # The scan reads maksimtech/apkradar:latest from Docker Hub rather than
  # building anything, so it only says something new once a new image has been
  # published. That happens on a tag, while this workflow runs on a push to main
  # and weekly, so workflow_dispatch is what makes a scan right after a release
  # possible.
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  scout:
    name: Docker Scout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          # cves says what is broken in the image; recommendations says
          # whether a base image exists that fixes it. On 2026-09-26 the first
          # scan of exeradar found five HIGH CVEs, all of them in
          # python:3.14-slim-trixie and none in this project's code — which is
          # a fact nobody can act on without the second command.
          command: cves,recommendations
          image: maksimtech/apkradar:latest
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('scout-results.sarif') != ''
        with:
          sarif_file: scout-results.sarif
