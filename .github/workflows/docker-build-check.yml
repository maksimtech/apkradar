name: Docker Build Check
# Builds the image and runs the smoke test without pushing anything. docker.yml
# cannot serve this purpose: it publishes to Docker Hub, including the :latest tag, so
# running it is a release.
#
# On every push and pull request, because the only other thing that builds this image
# is the workflow that publishes it — so until this ran on its own, the first attempt
# at a build was the one that released. It could not run on its own before: the
# Dockerfile only knew how to install from the index, so this had to be handed a
# published version to build anything at all.
#
# Given a version it still builds that one from the index, which is how an older image
# is reproduced. Given nothing it builds this checkout, which is what the next release
# will build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to reproduce (default: build this checkout)'
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A version was asked for → reproduce that one from the index. Nothing was asked
      # for → build what is in this checkout, and take the version out of the package
      # rather than off the index, so the smoke test compares the image against the code
      # it was built from.
      - name: Decide what to build
        id: ver
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            SOURCE=pypi
            VERSION="${REQUESTED#v}"
          else
            SOURCE=local
            VERSION=$(python3 -c "import apkradar; print(apkradar.__version__)")
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building apkradar $VERSION from $SOURCE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: apkradar:build-check
          build-args: |
            APKRADAR_SOURCE=${{ steps.ver.outputs.source }}
            APKRADAR_VERSION=${{ steps.ver.outputs.version }}

      - name: Smoke test (the CLI runs as the container user)
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm apkradar:build-check --help > /dev/null
          docker run --rm -i -e EXPECTED_VERSION --entrypoint python apkradar:build-check - < tests/docker/smoke.py

      # What the image contains, read from the image itself. This is the only place
      # it can be read: Docker Desktop will not install on the machine this is
      # developed on, where Windows 10 IoT Enterprise LTSC 2021 is build 19044 and
      # Docker requires 19045 — a build that edition never receives. A Linux runner
      # is the truer place for the question anyway.
      #
      # See tests/docker/inspect.sh for what it settles: SECURITY-EXCEPTIONS.toml
      # answers two of its claims with evidence borrowed from patchradar's image
      # rather than measured in this one.
      - name: What the image contains
        run: docker run --rm -i --entrypoint sh apkradar:build-check - < tests/docker/inspect.sh
