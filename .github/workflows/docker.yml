name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        # No default: a default that is a version is a version that rots, and the
        # dispatch form arrives pre-filled with something that looks deliberate.
        # `v2026.09.8` sat here while this project was at 2026.43.
        description: 'Tag of a published release to rebuild (e.g. v2026.43)'
        required: true
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      # The tag being built, not the default branch. The image is built from this
      # checkout now, and there is no smoke test between the build and the push below,
      # so a checkout standing in the wrong place publishes the wrong code rather than
      # failing on a version mismatch.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The dispatch input arrives through env:, never pasted into the script.
      # `${{ }}` is substituted before bash reads it, so a quote typed into the
      # form was code, in a job that holds the Docker Hub token. NORMALIZED is
      # gone with it: nothing read it, and it pasted the same value into Python.
      - name: Extract version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="$REQUESTED"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          # It becomes an image tag and a step output: a release tag, or nothing.
          if [[ ! "$RAW" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::not a release tag: $RAW"
            exit 1
          fi
          echo "VERSION=${RAW}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/apkradar:latest
            maksimtech/apkradar:${{ steps.version.outputs.VERSION }}
          build-args: |
            APKRADAR_SOURCE=local
