name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.8)'
        required: true
        default: 'v2026.09.8'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          NORMALIZED=$(python3 -c "parts='${RAW#v}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "NORMALIZED=${NORMALIZED}" >> $GITHUB_OUTPUT
      # publish.yml runs in parallel on the same tag push, so this job can reach
      # `pip install apkradar==<new version>` before the version exists at all.
      # A fixed `sleep 60` stood here and lost that race twice — 2026.9.32 on
      # 2026-09-24 and v2026.41 on 2026-09-30 — each time reported as
      # "No matching distribution found", which reads like a failed publish while
      # PyPI already had the files. Polling asks the question the Dockerfile asks,
      # with pip, until the index answers it.
      #
      # After the version step, not before it: the wait needs the normalized
      # version, because `apkradar==v2026.41` is not a version pip can ever find.
      - name: Wait for apkradar on PyPI
        env:
          VERSION: ${{ steps.version.outputs.NORMALIZED }}
        run: bash .github/scripts/wait_for_pypi.sh apkradar "$VERSION"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/apkradar:latest
            maksimtech/apkradar:${{ steps.version.outputs.VERSION }}
          build-args: |
            APKRADAR_VERSION=${{ steps.version.outputs.NORMALIZED }}
