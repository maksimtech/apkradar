name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.1)'
        required: true
        default: 'v2026.09.1'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          echo "PIP_VERSION=${RAW#v}" >> $GITHUB_OUTPUT
          NORMALIZED=$(python3 -c "parts='${RAW#v}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "NORMALIZED=${NORMALIZED}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maksimtech/apkradar:latest
            maksimtech/apkradar:${{ steps.version.outputs.VERSION }}
          build-args: |
            APKRADAR_VERSION=${{ steps.version.outputs.NORMALIZED }}
