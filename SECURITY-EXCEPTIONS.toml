# 2026.49 on deb13u4 (#121). The image built from main runs `apt-get upgrade` and
# has the fix; Trivy, which reads that one, does not report them. Review on
# 2026-12-08, the day after the release that rebuilds the published image.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-19499"
source = "Docker Scout"
where = "glibc 2.41-12+deb13u4 (libc6), python:3.14-slim-trixie base image, published image 2026.49"
why = """
strfmon() and strfmon_l() may write past the caller's buffer when a conversion \
pads to a width (Debian security tracker; GLIBC-SA-2026-0017). Debian fixed it \
for trixie in glibc 2.41-12+deb13u5 (`patchradar debian`, 2026-11-21). Docker \
Scout reports it as high against the image published for 2026.49, built on \
deb13u4 before that update.

The image built from this source runs `apt-get upgrade` and carries deb13u5. \
Nothing in apkradar formats money: Python's locale.currency() is written in \
Python and does not call strfmon.

When the release of 2026-12-07 publishes the new image, this entry stops \
matching and fails the build as unused: delete it then.
"""
review_by = "2026-12-08"

