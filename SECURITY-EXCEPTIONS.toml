"""
review_by = "2026-12-31"

[[exception]]
id = "SNYK-DEBIAN13-GCC14-20386241"
source = "Snyk Container"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
CVE-2026-95619, an integer overflow in gcc-14, published against the base image \
on 2026-10-02. Read with `patchradar debian CVE-2026-95619`: open in trixie for \
gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19), no fixed version in any suite, no \
Debian bug recorded. Evidence goes on \
https://security-tracker.debian.org/tracker/CVE-2026-95619.

What is not established, and is worth saying rather than glossing: Snyk names the \
source package `gcc-14`, and Debian's gcc source produces both the compiler and \
`libstdc++6`. A flaw in cc1 needs something to compile, and nothing in this image \
compiles anything; a flaw in the runtime is a different exposure. Which binary \
package is installed had been asserted and never measured, so \
`tests/docker/inspect.sh` now prints the gcc and libstdc++ packages and the next \
`docker-build-check` run answers it.
"""
review_by = "2026-12-31"

