# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, seven alerts across two test
# files. Read line by line on 2026-09-29 before being written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. In these files the left side
# is a domain expected in generated output and the right side is a report, not a
# URL: `assert "moonactive.com" in line`. Nothing is being sanitized and no
# decision is taken on the result beyond whether the test passes.
#
# The check that matters is not in the tests but in the code, and it was made
# rather than assumed. apkradar compares hosts by equality and suffix everywhere
# it matters — publisher.py:123 and :186, cli.py:259, all of the form
# `host == known or host.endswith("." + known)` — so `evil-facebook.com` does not
# pass for `facebook.com`, which is the defect this rule exists to catch. Had it
# been a substring test there, these alerts would have been a fix and not an
# entry.
#
# An entry here is scoped to its file, so a genuine occurrence of this rule
# anywhere else still fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_publisher_letter.py"
where = "test_publisher_letter.py:277, 309, 310 — assertions on the generated letter"
why = """
Three assertions that a domain appears, or does not appear, in a line of the \
letter apkradar writes for a publisher. The subject is text this repository \
generated in the same test; there is no URL, no sanitization and no security \
decision on the outcome.
"""
review_by = "2026-12-31"

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_publisher_provenance.py"
where = "test_publisher_provenance.py:280, 374, 406, 427 — assertions on provenance output"
why = """
Four assertions that a domain is present in provenance output or in the domain \
list a result carries. Same shape as the letter tests above: generated text on \
the right, a literal on the left, nothing sanitized.
"""
review_by = "2026-12-31"

