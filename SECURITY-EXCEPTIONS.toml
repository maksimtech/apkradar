# well: observe.py:92 (`host == domain or host.endswith("." + domain)` for the
# consent platforms), :372 (`r.host != _AD_HOST`, exact, for ad requests) and the
# set membership of `compare`. The alerts went unanswered for two days because
# the first remedy tried was to rewrite one assertion as `in text.split()`, which
