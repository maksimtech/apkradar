# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.
#
# Written on 2026-09-29 against the twelve blocking alerts GitHub then held for
# this repository. Nothing here was written from memory or by analogy with
# another Radar: the Debian positions below were read out of the security
# tracker with `patchradar debian`, and the CodeQL ones by opening the lines.

# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image. `apt-get upgrade` runs at build
# time and the image is rebuilt at every release, so a fix Debian ships arrives
# here without anyone chasing it.
#
# The four below are not one case, although every scanner prints them the same
# way — "no fix available", one line, no distinction:
#
#   zlib, perl   open in bookworm, trixie, sid and forky alike, nothing
#                scheduled anywhere. Waiting is not a plan; the Debian bug is
#                where evidence goes.
#   attr, acl    already fixed in unstable, filed no-dsa for trixie *because the
#                fix comes in a point release*. That waiting ends at a dated
#                event: rebuild after it.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python slim-trixie base image"
why = """
Debian reports no fixed version in any suite — open in bookworm, trixie, sid and \
forky, urgency not yet assigned, Debian bug 1146895. There is nothing to wait \
for and nothing to ask for; what moves a flaw in this state is evidence on that \
bug.

Nothing in this repository can close it either: the package comes from the base \
image and is rebuilt at every release. An out-of-bounds write reached through \
gzprintf; apkradar uses zlib only through Python's own zlib module and through \
the APK reader, never on attacker-chosen compressed streams outside an archive \
it was asked to open.
"""
review_by = "2026-12-31"

[[exception]]
id = "SNYK-DEBIAN13-ZLIB-19520500"
source = "Snyk Container"
where = "zlib, python slim-trixie base image"
why = "The same zlib flaw as CVE-2026-85091 above, reported by the other scanner."
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-82560"
source = "Docker Scout"
where = "perl-base, python slim-trixie base image"
why = """
Open in all four suites, including sid — Debian bug 1148455, nothing scheduled. \
Scout names the *source* package `perl`, which in Debian produces both the \
removable `perl` and `perl-base`, which is Essential and which dpkg itself \
depends on. Measured inside the built patchradar image on 2026-09-29, only \
`perl-base` is installed; this image is built the same way, so the finding is \
ours to record and not ours to close.
"""
review_by = "2026-12-31"

[[exception]]
id = "SNYK-DEBIAN13-ATTR-17678182"
source = "Snyk Container"
where = "attr 1:2.5.2-3, python slim-trixie base image"
why = """
CVE-2026-54371, and not "no fix available" as the one-line report implies: \
Debian has fixed it in unstable and forky (attr 1:2.6.0-1) and filed it no-dsa \
for trixie with the note "Will be fixed first in unstable, then point release \
update; not to be backported by individual patches" — Debian bug 1141107.

The fix is scheduled, not absent, so the only thing to do is rebuild after the \
next trixie point release. The date below is set for that: if the point release \
has happened and this is still reported, the rebuild did not happen. The flaw is \
a symlink traversal in recursive getfattr/setfattr, which apkradar never runs.
"""
review_by = "2026-11-30"

[[exception]]
id = "SNYK-DEBIAN13-ACL-17677866"
source = "Snyk Container"
where = "acl 2.3.2-2, python slim-trixie base image"
why = """
CVE-2026-54369, Debian bug 1141110, in the same position as attr above: fixed in \
unstable and forky (acl 2.4.0-1), no-dsa for trixie with the fix scheduled for a \
point release. Debian's note says why it cannot be backported piecemeal — the \
fix adds the `acl_*_at()` ABI of 2.4.0.

A local TOCTOU in recursive setfacl/chacl; apkradar calls neither.
"""
review_by = "2026-11-30"

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, seven alerts across two test
# files. Read line by line on 2026-09-29 before being written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. In these files the left side
# is a domain expected in generated output and the right side is a report, not a
# URL: `assert "moonactive.com" in line`. Nothing is being sanitized and no
# decision is taken on the result beyond whether the test passes.
#
# The check that matters is not in the tests but in the code, and it was made
# rather than assumed. apkradar compares hosts by equality and suffix everywhere
# it matters — publisher.py:123 and :186, cli.py:259, all of the form
# `host == known or host.endswith("." + known)` — so `evil-facebook.com` does not
# pass for `facebook.com`, which is the defect this rule exists to catch. Had it
# been a substring test there, these alerts would have been a fix and not an
# entry.
#
# An entry here is scoped to its file, so a genuine occurrence of this rule
# anywhere else still fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_publisher_letter.py"
where = "test_publisher_letter.py:277, 309, 310 — assertions on the generated letter"
why = """
Three assertions that a domain appears, or does not appear, in a line of the \
letter apkradar writes for a publisher. The subject is text this repository \
generated in the same test; there is no URL, no sanitization and no security \
decision on the outcome.
"""
review_by = "2026-12-31"

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_publisher_provenance.py"
where = "test_publisher_provenance.py:280, 374, 406, 427 — assertions on provenance output"
why = """
Four assertions that a domain is present in provenance output or in the domain \
list a result carries. Same shape as the letter tests above: generated text on \
the right, a literal on the left, nothing sanitized.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# Arrived on 2026-09-30, after 2026.41 was prepared: two advisories published
# overnight against the base image, which the gate refused before the tag. That
# is the gate working — not a defect introduced here — and the two are in
# different situations, read out of the Debian security tracker with
# `patchradar debian` rather than from the scanners' one-line summaries.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-84782"
source = "Docker Scout"
where = "openssl 3.5.7-1~deb13u2 in the published image; fixed in Debian 3.5.7-1~deb13u3"
why = """
An out-of-bounds read in OpenSSL's DTLS retransmission, advisory published \
2026-09-29. Debian has already fixed it: `patchradar debian CVE-2026-84782` \
reports it resolved in trixie at openssl 3.5.7-1~deb13u3, so this is not an \
acceptance — it is a rebuild.

The Dockerfile runs `apt-get update && apt-get upgrade -y`, so the next image \
built picks the fix up with no change to this repository. Docker Scout reads the \
image published on Docker Hub, which is why the alert stays open until then. The \
short date is the check that the publish happened: if this is still here \
afterwards, either the image was not republished or the upgrade did not take.

Reachability, for what it is worth: the flaw is in DTLS, and nothing here speaks \
DTLS. mailradar opens TLS sockets over TCP to check certificates, cookieradar \
drives Chromium over HTTPS, apkradar fetches store listings over HTTPS. None of \
that is datagram TLS.
"""
review_by = "2026-10-31"

[[exception]]
id = "SNYK-DEBIAN13-GCC14-20335537"
source = "Snyk Container"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
CVE-2026-102010. Open in trixie for both gcc-12 (12.4.0-5) and gcc-14 \
(14.2.0-19), with no fixed version in any suite and no Debian bug recorded — \
checked with `patchradar debian CVE-2026-102010`. So there is nothing to wait for \
and nothing to ask for: what moves a flaw in this state is evidence on the \
tracker page, https://security-tracker.debian.org/tracker/CVE-2026-102010.

Nor is it removable. Snyk names the source package `gcc-14`, and what is actually \
installed is `libstdc++6`, the C++ runtime that a long list of packages in the \
base image link against. Removing it is not an option the way the full `perl` \
would have been.
"""
review_by = "2026-12-31"


