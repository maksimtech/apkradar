[[exception]]
id = "CVE-2026-102010"
source = "Docker Scout"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
The flaw already recorded here as SNYK-DEBIAN13-GCC14-20335537, reported by the \
other scanner under its CVE number. Open in trixie for gcc-12 and gcc-14 with no \
fixed version in any suite and no Debian bug — checked with \
`patchradar debian CVE-2026-102010`. Evidence goes on \
