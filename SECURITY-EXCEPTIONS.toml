# ─────────────────────────────────────────────────────────────────────────────
# What Trivy's image scan reported on its first run, 2026-11-02, and no scanner
# had reported as high before. Eight CVEs in six Debian source packages, all
# "no fix" for trixie, none in code apkradar runs. Accepted by the maintainer on
# 2026-11-02 to wait for Debian's fixes, which the next release's rebuild picks
# up. Read from the Debian tracker where the page could be opened, and from
# Ubuntu, NVD and OSV where it could not — each entry says which.
#
# The container runs as the unprivileged user `apkradar` (Dockerfile, USER) and
# its entrypoint is apkradar itself; none of these packages' programs is run by
# it. The libraries are loaded only by whatever links them, which for sqlite was
# measured rather than assumed: a real `scan()` of an APK built by
# tests/android_files.py loaded no sqlite3, _sqlite3, sqlalchemy or IPython module.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-76642"
source = "Trivy"
where = "util-linux 2.41.5-0+deb13u1 (bsdutils, libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login, mount, util-linux), python slim-trixie base image"
why = """
libmount does not check the mount helper's exit status before running \
post-mount hooks (X-mount.idmap, X-mount.owner), so an unprivileged user may run \
privileged operations on existing filesystems. Debian tracker: no-dsa for trixie, \
"Minor issue"; fixed in forky and sid (2.42.3-1); bookworm not affected.

Needs a local user running `mount` inside the container. apkradar never mounts \
anything. Like every finding in this block, it waits for Debian: `apt-get upgrade` runs at \
build time, so the release after Debian ships a fix carries it, and the review \
date is when to look at whether it has.
"""
review_by = "2026-12-31"

